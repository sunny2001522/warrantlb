server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Prevent leaking internal :8080 port into 301 Location headers (Cloud Run fronting on :443)
    port_in_redirect off;
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # API proxy (matches vite dev server proxy config)
    location /api/experience-course {
        proxy_pass https://columnist-landingpage.cmoney.tw;
        proxy_set_header Host columnist-landingpage.cmoney.tw;
        proxy_ssl_server_name on;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/index.html /index.html;
    }

    # Long cache for hashed assets
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache for index.html
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
