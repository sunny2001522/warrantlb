# >>> cm-deploy managed >>>
# 由 cm-deploy/nodes/sonar-init 自動寫入；請勿手動編輯本區塊（重跑 sonar-init 會覆蓋）
# 客製化指引：要加 sonar.exclusions / sonar.test.inclusions / sonar.coverage.* 等請寫在
# 本 managed block **之外**（檔尾或檔頭），sonar-init 重產時會保留 block 外的所有 entry
#
# 對應 .gitlab-ci.yml `sonarqube` job（stage: qa）。
# - projectKey / projectName：sonar-init render 時用 PM 機器算的真值寫死。
#   理由：sonar-scanner 不展開 .properties 檔內 `${VAR}`，GitLab CI runner 也不 pre-process
#   .properties；以前寫 `${CI_PROJECT_PATH_SLUG}` 會被 sonar-scanner 當 literal 讀成空字串，
#   導致 "not a valid project key" / URL scheme 缺失等 fail。
# - sonar.host.url：本檔不寫，由 sonar-scanner 從 SONAR_HOST_URL env var 自動讀；
#   SONAR_HOST_URL 由 GitLab top group var 注入（SRE 預設，cm-deploy 不檢查）。
sonar.projectKey=studio-services-author-mrwarrant-landingpage
sonar.projectName=landingpage
sonar.projectVersion=1.0
sonar.sources=.
sonar.sourceEncoding=UTF-8
# qualitygate.wait=true：sonar-scanner 等 quality gate 結果再退碼；對應 .gitlab-ci.yml
# allow_failure: false——CI 想擋爛 code 進 main，這裡就要等 gate 結果
sonar.qualitygate.wait=false
# <<< cm-deploy managed <<<
